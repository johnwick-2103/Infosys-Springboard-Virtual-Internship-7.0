<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Management Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    background:#eef2f7;
}

.sidebar{
    width:260px;
    height:100vh;
    background:linear-gradient(180deg,#1e3c72,#2a5298);
    color:white;
    position:fixed;
    left:0;
    top:0;
    overflow:auto;
}

.logo{
    padding:25px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.2);
}

.logo h2{
    font-size:28px;
}

.profile{
    text-align:center;
    padding:25px 10px;
}

.profile img{
    width:90px;
    height:90px;
    border-radius:50%;
    border:4px solid white;
    margin-bottom:10px;
}

.profile h3{
    font-size:22px;
}

.profile p{
    color:#ddd;
    font-size:14px;
}

.menu{
    list-style:none;
    margin-top:20px;
}

.menu li{
    margin:5px 0;
}

.menu li a{
    display:block;
    color:white;
    text-decoration:none;
    padding:15px 25px;
    transition:.3s;
}

.menu li a i{
    width:25px;
}

.menu li a:hover{
    background:rgba(255,255,255,.15);
    padding-left:35px;
}

.main{
    margin-left:260px;
    width:100%;
    padding:30px;
}

.header{
    background:white;
    padding:20px;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
    margin-bottom:25px;
}

.header h1{
    color:#2c3e50;
}

.header button{
    border:none;
    padding:12px 22px;
    background:linear-gradient(90deg,#ff512f,#dd2476);
    color:white;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.header button:hover{
    transform:translateY(-2px);
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.card{
    color:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card i{
    font-size:45px;
    margin-bottom:15px;
}

.card h2{
    margin:10px 0;
}

.blue{
    background:linear-gradient(135deg,#36d1dc,#5b86e5);
}

.green{
    background:linear-gradient(135deg,#11998e,#38ef7d);
}

.orange{
    background:linear-gradient(135deg,#f7971e,#ffd200);
}

.red{
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
}

.table-box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:linear-gradient(90deg,#36d1dc,#5b86e5);
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:nth-child(even){
    background:#f8fbff;
}

tr:hover{
    background:#eef8ff;
}

.active{
    background:#d4edda;
    color:#28a745;
    padding:6px 15px;
    border-radius:20px;
    font-weight:bold;
}

.completed{
    background:#d1ecff;
    color:#007bff;
    padding:6px 15px;
    border-radius:20px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#ff9800;
    padding:6px 15px;
    border-radius:20px;
    font-weight:bold;
}

.btn{
    border:none;
    background:linear-gradient(90deg,#ff512f,#dd2476);
    color:white;
    padding:8px 18px;
    border-radius:20px;
    cursor:pointer;
}

@media(max-width:992px){

    .sidebar{
        width:220px;
    }

    .main{
        margin-left:220px;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:768px){

    body{
        display:block;
    }

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .main{
        margin-left:0;
        padding:15px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .table-box{
        overflow:auto;
    }

    table{
        min-width:900px;
    }

}


</style>

</head>
