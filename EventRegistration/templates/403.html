{% extends 'base.html' %}
{% block title %}403 - Permission Denied{% endblock %}
{% block page_title %}Access Denied{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
<div class="col-lg-6 text-center">
  <div style="font-size:100px;font-weight:900;line-height:1;background:linear-gradient(135deg,#ef4444,#dc2626);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">403</div>
  <h3 class="fw-bold mt-3 mb-2">Access Denied</h3>
  <p class="text-muted mb-4">You do not have permission to access this page. Administrator privileges are required.</p>
  <a href="{% url 'dashboard' %}" class="btn btn-primary rounded-pill px-5 py-2 fw-bold"><i class="fas fa-home me-2"></i>Back to Dashboard</a>
</div>
</div>
{% endblock %}
