{% extends 'base.html' %}

{% block title %}Edit Event Category{% endblock %}
{% block page_title %}Edit Category Information{% endblock %}

{% block extra_css %}
<style>
.form-group{ margin-bottom:20px; }
label{ display:block; margin-bottom:8px; font-weight:bold; color:#444; }
input, textarea{ width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; font-size:15px; outline:none; }
textarea{ height:100px; resize:none; }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <div style="margin-bottom:20px;">
        <a href="{% url 'event_category' %}" class="btn btn-secondary">← Back to Category List</a>
    </div>

    <h2>Edit Category #{{ category.id }}</h2>
    <br>

    <form method="POST" action="{% url 'edit_event_category' category.id %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Category Name</label>
            <input type="text" id="name" name="name" value="{{ category.name }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ category.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">Update Category</button>
    </form>
</div>
{% endblock %}
