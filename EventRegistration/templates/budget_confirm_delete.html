{% extends 'base.html' %}
{% block title %}Delete Budget - EMS{% endblock %}
{% block page_title %}Delete Budget{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-lg-5">
  <div class="card text-center p-5" style="border-radius:18px;border:2px solid #ef4444;background:var(--content-bg);">
    <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
    <h4 class="fw-bold mb-2">Delete Budget Record</h4>
    <h5 class="text-danger mb-4">"Budget for {{ budget.event.title }}"</h5>
    <p class="text-muted small">This action cannot be undone.</p>
    <form method="POST" class="d-flex gap-3 justify-content-center mt-3">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger rounded-pill px-5 fw-bold"><i class="fas fa-trash me-2"></i>Delete</button>
      <a href="{% url 'budget_list' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
    </form>
  </div>
</div>
</div>
{% endblock %}
